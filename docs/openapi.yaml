openapi: 3.0.3
info:
  title: RosTalk HTTP API
  version: 1.0.0
  description: |
    Bearer-token administration API (stage 3.2). A token acts as exactly one
    role: the same `internal/perms` and `internal/roles` rules as the control
    plane decide what it may do. Tokens are minted in the client (Server → API)
    or with `POST /api/v1/tokens`; the plaintext is returned once and only its
    SHA-256 hash is stored.

    The New Year event uses the user session bearer issued in Welcome. Its
    routes accept only the listed method and path pairs, without a query.
    All event success responses are JSON with Cache-Control: no-store.

    Errors are JSON objects with a stable `code`. `401` means the token is
    missing, unknown, expired or revoked; `403` means the token role may not do
    this; `404` hides objects the token cannot see.
servers:
  - url: https://{host}:7443/api/v1
    variables:
      host:
        default: 192.168.0.13
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - permission_denied
                - hierarchy
                - not_found
                - invalid_request
                - rejected
                - internal
                - event_closed
                - not_enrolled
                - day_changed
                - already_claimed
                - already_watered
                - no_water
                - insufficient_flakes
                - layout_conflict
                - not_owned
                - background_locked
                - invalid_layout
                - rate_limited
                - file_too_large
                - unsupported_media_type
            message:
              type: string
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        roleIds:
          type: array
          items: { type: integer, format: int64 }
        online: { type: boolean }
        lastSeenAtUnixMs: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        avatarHash: { type: string, description: SHA-256 hex of the 256x256 avatar, empty when none. }
    Channel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        position: { type: integer, format: int32 }
        name: { type: string }
        topic: { type: string }
        kind: { type: string, enum: [voice, text] }
        userLimit: { type: integer, format: int32 }
        passwordProtected: { type: boolean }
        voiceProfile: { type: string, enum: [voice, voiceHq, music] }
        temporary: { type: boolean }
        userCount: { type: integer, format: int32 }
        afk: { type: boolean }
    Invite:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roleId: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        createdAtUnixMs: { type: integer, format: int64 }
        expiresAtUnixMs: { type: integer, format: int64 }
        maxUses: { type: integer, format: int32 }
        usedCount: { type: integer, format: int32 }
        revokedAtUnixMs: { type: integer, format: int64 }
        url:
          type: string
          description: Filled only in the reply to POST /invites.
    Ban:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        publicKey: { type: string }
        ip: { type: string }
        reason: { type: string }
        createdBy: { type: integer, format: int64 }
        createdAtUnixMs: { type: integer, format: int64 }
        expiresAtUnixMs: { type: integer, format: int64 }
        expired: { type: boolean }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        actorName: { type: string }
        action: { type: string }
        targetUserId: { type: integer, format: int64 }
        targetChannelId: { type: integer, format: int64 }
        targetRoleId: { type: integer, format: int64 }
        details: { type: string }
        createdAtUnixMs: { type: integer, format: int64 }
    Token:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        roleId: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64 }
        createdAtUnixMs: { type: integer, format: int64 }
        expiresAtUnixMs: { type: integer, format: int64 }
        revokedAtUnixMs: { type: integer, format: int64 }
        lastUsedAtUnixMs: { type: integer, format: int64 }
        token:
          type: string
          description: Plaintext token, present only in the 201 reply to POST /tokens.
    NewYearSupport:
      type: object
      required: [apiVersion, season, phase]
      properties:
        apiVersion: { type: integer, enum: [1] }
        season: { type: string, example: '2026-12' }
        phase:
          type: string
          enum: [upcoming, active, gallery, closed]
    NewYearPlacement:
      type: object
      additionalProperties: false
      required: [itemId, x, y, scale, rotation]
      description: |
        Crown coordinates run 0..1000 from the top left. The server accepts
        `140 <= y <= 930` and `abs(x - 500) <= floor(0.42 * y) - 35`, so
        (523,140) is accepted while (524,140) and (500,139) are not.
      properties:
        itemId: { type: string }
        x: { type: integer, minimum: 0, maximum: 1000 }
        y: { type: integer, minimum: 140, maximum: 930 }
        scale: { type: integer, minimum: 60, maximum: 140, description: Percent. }
        rotation: { type: integer, minimum: -45, maximum: 45, description: Degrees. }
    NewYearLayout:
      type: object
      additionalProperties: false
      required: [version, background, placements]
      properties:
        version: { type: integer, minimum: 0 }
        background: { type: string, enum: [dusk, aurora] }
        placements:
          type: array
          maxItems: 20
          description: Back to front.
          items: { $ref: '#/components/schemas/NewYearPlacement' }
    NewYearState:
      type: object
      required: [season, phase, zone, day, nextDayAt, enrolled, water, flakes, claims, wateredDays, growthDays, inventory, layout, unlockedBackgrounds, history]
      example:
        season: '2026-12'
        phase: active
        zone: UTC
        day: '2026-12-01'
        nextDayAt: '2026-12-02T00:00:00Z'
        enrolled: true
        water: 0
        flakes: 2
        claims: [{ day: '2026-12-01', itemId: ball-red }]
        wateredDays: ['2026-12-01']
        growthDays: 1
        inventory: [{ itemId: ball-red, qty: 1 }]
        layout: { version: 0, background: dusk, placements: [] }
        unlockedBackgrounds: [dusk]
        history: [{ kind: voice, delta: 2, at: '2026-12-01T12:05:00Z' }]
      properties:
        season: { type: string }
        phase: { type: string, enum: [upcoming, active, gallery] }
        zone: { type: string, description: IANA zone of the season calendar. }
        day: { type: string, format: date, description: Current season-local day. }
        nextDayAt: { type: string, format: date-time, description: UTC instant of the next server midnight. }
        enrolled: { type: boolean }
        water: { type: integer }
        flakes: { type: integer }
        claims:
          type: array
          description: Ascending by day.
          items:
            type: object
            required: [day, itemId]
            properties:
              day: { type: string, format: date }
              itemId: { type: string }
        wateredDays:
          type: array
          items: { type: string, format: date }
        growthDays: { type: integer, minimum: 0, maximum: 31 }
        inventory:
          type: array
          description: Ascending by item id.
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId: { type: string }
              qty: { type: integer, minimum: 1 }
        layout: { $ref: '#/components/schemas/NewYearLayout' }
        unlockedBackgrounds:
          type: array
          items: { type: string, enum: [dusk, aurora] }
        history:
          type: array
          maxItems: 20
          description: Newest first, signed changes only.
          items:
            type: object
            required: [kind, delta, at]
            properties:
              kind: { type: string, enum: [chat, voice, spin, duplicate] }
              delta: { type: integer }
              at: { type: string, format: date-time }
    NewYearReceipt:
      type: object
      required: [requestId, itemId, duplicate, refund, cost]
      properties:
        requestId: { type: string }
        itemId: { type: string }
        duplicate: { type: boolean }
        refund: { type: integer, description: 2 for a duplicate, otherwise 0. }
        cost: { type: integer, enum: [6] }
    NewYearClaimReply:
      type: object
      required: [itemId, state]
      properties:
        itemId: { type: string, example: ball-red }
        state: { $ref: '#/components/schemas/NewYearState' }
    NewYearSpinReply:
      type: object
      required: [receipt, state]
      properties:
        receipt: { $ref: '#/components/schemas/NewYearReceipt' }
        state: { $ref: '#/components/schemas/NewYearState' }
    NewYearTreeReply:
      type: object
      required: [tree]
      properties:
        tree:
          type: object
          nullable: true
          required: [growthDays, background, placements]
          properties:
            growthDays: { type: integer, minimum: 0, maximum: 31 }
            background: { type: string, enum: [dusk, aurora] }
            placements:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/NewYearPlacement' }
      example: { tree: { growthDays: 1, background: dusk, placements: [] } }
    NewYearCatalog:
      type: object
      description: |
        Contract example of catalog v1. The server owns the weights and the
        price; a different catalog or price needs a new negotiated major
        version. A roll in [0,99] selects the rarity by cumulative weight and
        then one item of that rarity uniformly. An item the player already
        owns converts the spin to `duplicateRefund` snowflakes.
      example: {"rarities":[{"name":"common","weight":60,"items":["ball-red","ball-gold","ball-blue","candy-cane","pine-cone","snowflake"]},{"name":"rare","weight":25,"items":["ball-glass-house","bell-gold","ribbon-bow","icicle-silver"]},{"name":"epic","weight":12,"items":["ball-aurora","snow-globe","gingerbread-house"]},{"name":"legendary","weight":3,"items":["star-topper","deer-gold","clock-midnight"]}],"spinCost":6,"duplicateRefund":2}
    ChatAttachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer, format: int32 }
        height: { type: integer, format: int32 }
        image: { type: boolean }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        channelId: { type: integer, format: int64, description: 0 for a direct message. }
        senderId: { type: integer, format: int64 }
        recipientId: { type: integer, format: int64, description: The other participant of a direct message, 0 in a channel. }
        senderNickname: { type: string }
        body: { type: string }
        createdAtUnixMs: { type: integer, format: int64 }
        editedAtUnixMs: { type: integer, format: int64 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/ChatAttachment' }
        mentionUserIds:
          type: array
          items: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: Missing, unknown, expired or revoked token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The token role may not perform the action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The object does not exist or is not visible to this token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed JSON or invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The server rejected the change (built-in role, last admin, occupied channel).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearConflict:
      description: |
        The rule refused the request. Codes: `event_closed`, `not_enrolled`,
        `day_changed`, `already_claimed`, `already_watered`, `no_water`,
        `insufficient_flakes`, `layout_conflict`, `not_owned`, `background_locked`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearTooLarge:
      description: The body exceeds 256 bytes (4096 for the layout), `file_too_large`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearUnsupportedMedia:
      description: The body is not `application/json`, `unsupported_media_type`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearRateLimited:
      description: More than the burst of 8 mutations, `rate_limited`; retry after one second.
      headers:
        Retry-After:
          schema: { type: integer, enum: [1] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearBadRequest:
      description: Invalid JSON or field value, `invalid_request`; layout bounds or count violation, `invalid_layout`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NewYearInternal:
      description: The server could not complete the request, `internal`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /users:
    get:
      summary: List known users
      description: Requires a moderation or role right (`kick`, `ban`, `moveMembers`, `muteMembers`, `deafenMembers`, `manageRoles`) or `manageServer`.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive nickname substring.
        - in: query
          name: online
          schema: { type: boolean, default: false }
          description: "`true` returns online users only."
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /channels:
    get:
      summary: List visible channels
      description: Every channel the token role may view, in display order.
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /invites:
    get:
      summary: List invites
      description: Requires `manageInvites`.
      parameters:
        - in: query
          name: include_inactive
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an invite
      description: Requires `manageInvites`. The `url` is returned only here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: integer, format: int64, description: 0 means the default Member role. }
                maxUses: { type: integer, format: int32, description: 0 means one use. }
                expiresInSeconds: { type: integer, format: int32, description: 0 means never expires. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invites/{id}:
    delete:
      summary: Revoke an invite
      description: Requires `manageInvites`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /members/{id}/kick:
    post:
      summary: Kick a user
      description: Requires `kick`, a lower role and a known user.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: Kicked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /members/{id}/ban:
    post:
      summary: Ban a user
      description: Requires `ban` and a lower role. `byKey` defaults to true.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                expiresInSeconds: { type: integer, format: int32, description: 0 means permanent. }
                byKey: { type: boolean, nullable: true }
                byIp: { type: boolean, description: Requires the user to be online. }
      responses:
        '204': { description: Banned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Lift a key ban of a user
      description: Requires `ban`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Unbanned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /members/{id}/move:
    post:
      summary: Move a user to another channel
      description: Requires `moveMembers`, a lower role and the target's join right in the destination.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { type: integer, format: int64, description: 0 removes the user from every channel. }
      responses:
        '204': { description: Moved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bans:
    get:
      summary: List bans
      description: Requires `ban`.
      parameters:
        - in: query
          name: include_expired
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Bans
          content:
            application/json:
              schema:
                type: object
                properties:
                  bans:
                    type: array
                    items: { $ref: '#/components/schemas/Ban' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bans/ip/{ip}:
    delete:
      summary: Lift an address ban
      description: Requires `ban`.
      parameters:
        - in: path
          name: ip
          required: true
          schema: { type: string }
      responses:
        '204': { description: Unbanned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit:
    get:
      summary: Read the audit log
      description: Requires `viewAuditLog`. Newest first.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, format: int32, default: 50, maximum: 200 }
        - in: query
          name: before_id
          schema: { type: integer, format: int64, default: 0 }
        - in: query
          name: action
          schema: { type: string }
          description: Action prefix, for example `member.`.
        - in: query
          name: actor_id
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextBeforeId: { type: integer, format: int64 }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tokens:
    get:
      summary: List API tokens
      description: Requires `manageServer`. Secrets are never returned.
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create an API token
      description: Requires `manageServer`. The plaintext token appears only in this reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, roleId]
              properties:
                name: { type: string, maxLength: 64 }
                roleId: { type: integer, format: int64 }
                expiresInSeconds: { type: integer, format: int32, description: 0 means never expires. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/Token' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tokens/{id}:
    delete:
      summary: Revoke an API token
      description: Requires `manageServer`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/history:
    get:
      summary: Read one page of chat history
      description: |
        The bearer token must belong to a user session (the token issued in
        `Welcome` and used by the desktop core's loopback proxy), not to an
        API token. `channelId` and `peerId` are mutually exclusive. Cursors are
        opaque and bound to the conversation; an empty cursor starts at the
        newest message.
      parameters:
        - in: query
          name: channelId
          schema: { type: integer, format: int64 }
        - in: query
          name: peerId
          schema: { type: integer, format: int64 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, format: int32, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page, oldest message first
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/attachments:
    post:
      summary: Upload one attachment
      description: |
        Uploads before the message is sent; the returned id is claimed by
        `SendMessage`. The type is detected from the bytes, never from the file
        name. HTML, SVG and XML are rejected. The body is the raw file.
      parameters:
        - in: query
          name: channelId
          schema: { type: integer, format: int64 }
        - in: query
          name: peerId
          schema: { type: integer, format: int64 }
        - in: query
          name: name
          schema: { type: string, description: Display name only; never a path. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored and ready to claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: '#/components/schemas/ChatAttachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: The file is larger than `max_attachment_bytes` }
        '415': { description: The content type is not allowed }
        '507': { description: The server attachment quota is exhausted }
  /chat/attachments/{id}:
    get:
      summary: Read an attachment
      description: |
        Requires access to the message (view_channel, or participation in the
        direct conversation). Raster images are served inline; everything else
        is an attachment download. Both carry `X-Content-Type-Options: nosniff`
        and a sandboxing CSP.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/new-year/support:
    get:
      summary: Discover the built-in New Year event
      description: Returns the current phase without enrolling the caller.
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: &newYearNoStore
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearSupport' }
              example: { apiVersion: 1, season: '2026-12', phase: active }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/new-year/me:
    get:
      summary: Read the caller's event state
      description: Available upcoming, active and in the gallery. An unenrolled caller receives zero state.
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearState' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/me/enrollment:
    put:
      summary: Enroll in the active event
      description: The first active request enrolls the caller. A replay keeps the original enrollment date and state.
      requestBody:
        required: true
        description: 256 bytes maximum.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearState' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '413': { $ref: '#/components/responses/NewYearTooLarge' }
        '415': { $ref: '#/components/responses/NewYearUnsupportedMedia' }
        '429': { $ref: '#/components/responses/NewYearRateLimited' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/me/claim:
    post:
      summary: Claim the current day's gift
      description: The expected day must equal the current season-local day. Awards one water and one catalog item.
      requestBody:
        required: true
        description: 256 bytes maximum.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [day]
              properties:
                day: { type: string, format: date, example: '2026-12-01' }
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearClaimReply' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '413': { $ref: '#/components/responses/NewYearTooLarge' }
        '415': { $ref: '#/components/responses/NewYearUnsupportedMedia' }
        '429': { $ref: '#/components/responses/NewYearRateLimited' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/me/water:
    post:
      summary: Water the tree for the current day
      description: The expected day must equal the current season-local day. Costs one water and adds one growth day.
      requestBody:
        required: true
        description: 256 bytes maximum.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [day]
              properties:
                day: { type: string, format: date, example: '2026-12-01' }
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearState' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '413': { $ref: '#/components/responses/NewYearTooLarge' }
        '415': { $ref: '#/components/responses/NewYearUnsupportedMedia' }
        '429': { $ref: '#/components/responses/NewYearRateLimited' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/me/spins:
    post:
      summary: Open the ornament roulette
      description: Costs 6 flakes. A successful request ID can be replayed during the event and gallery for the original receipt and fresh state.
      requestBody:
        required: true
        description: 256 bytes maximum.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId:
                  type: string
                  format: uuid
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearSpinReply' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '413': { $ref: '#/components/responses/NewYearTooLarge' }
        '415': { $ref: '#/components/responses/NewYearUnsupportedMedia' }
        '429': { $ref: '#/components/responses/NewYearRateLimited' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/me/layout:
    put:
      summary: Replace the caller's tree layout
      description: A changed layout increments its version. A stale changed layout conflicts. An identical replay returns the current state.
      requestBody:
        required: true
        description: 4096 bytes maximum.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewYearLayout'
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearState' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '413': { $ref: '#/components/responses/NewYearTooLarge' }
        '415': { $ref: '#/components/responses/NewYearUnsupportedMedia' }
        '429': { $ref: '#/components/responses/NewYearRateLimited' }
        '500': { $ref: '#/components/responses/NewYearInternal' }
  /events/new-year/trees/{id}:
    get:
      summary: Read a visible participant's tree
      description: Available during the event and gallery. The target must be the caller or an online member visible to the caller. An unenrolled target has a null tree.
      parameters:
        - in: path
          name: id
          required: true
          description: Canonical positive decimal user ID with no leading zero or escapes.
          schema: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
      responses:
        '200':
          description: Success
          headers:
            Cache-Control: *newYearNoStore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewYearTreeReply' }
        '400': { $ref: '#/components/responses/NewYearBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NewYearConflict' }
        '500': { $ref: '#/components/responses/NewYearInternal' }

  /chat/export:
    get:
      summary: Export a conversation as JSON Lines
      description: |
        Streams every message of the conversation in ascending id order as one
        JSON object per line. The server reads the history in batches, so a long
        channel does not block other requests. Requires a user session token and
        access to the channel or direct conversation.
      parameters:
        - in: query
          name: channelId
          schema: { type: integer, format: int64 }
        - in: query
          name: peerId
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: JSON Lines attachment
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /avatars/me:
    put:
      summary: Set the caller's avatar
      description: |
        Requires a user session token (the token issued in `Welcome`), not an
        API token. The body is the raw picture; its declared content type and
        name are ignored. PNG, JPEG, WebP and GIF up to 4 MiB are accepted. The
        server decodes the picture, centre-crops it to a square, scales it to
        256x256 and re-encodes it as PNG or JPEG. The reply names the content
        hash other clients put into `User.avatar_hash`.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarHash: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: The picture is larger than 4 MiB. }
        '415': { description: The bytes are not PNG, JPEG, WebP or GIF. }
        '429': { description: Too many avatar changes in a short time. }
    delete:
      summary: Remove the caller's avatar
      description: Requires a user session token.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /avatars/{hash}:
    get:
      summary: Read an avatar by its content hash
      description: |
        Requires a user session token. The hash is the value of
        `User.avatar_hash`; the bytes are immutable, so the response carries
        `Cache-Control: public, max-age=31536000, immutable`.
      parameters:
        - in: path
          name: hash
          required: true
          schema: { type: string }
          description: Lowercase SHA-256 hex of the stored 256x256 picture.
      responses:
        '200':
          description: PNG or JPEG
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
