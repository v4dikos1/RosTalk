syntax = "proto3";

// Handshake frames: Hello -> Challenge -> Authenticate -> Welcome.
//
// The client owns an Ed25519 key pair stored in the OS keychain (design 4.2).
// The public key is the user's identity on the server; there are no passwords
// and no registration. The client never sends the private key or a signature of
// the TLS certificate: it signs nonce || server_id, so an unrelated server
// cannot replay the signature and the login does not depend on which TLS
// certificate the client saw (important for the future browser client).
package rostalk.v1;

import "rostalk/v1/state.proto";

option go_package = "github.com/v4dikos1/RosTalk/proto/gen/go/rostalk/v1;rostalkv1";

// Hello is the first frame of a connection. The server answers with Challenge
// or with an Error frame (unsupported protocol version, malformed key, ban).
message Hello {
  // Wire protocol version implemented by the client. The server currently
  // speaks version 1. A mismatch is fatal and answered with
  // ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED plus a link to a newer client.
  uint32 protocol_version = 1;

  // Human-readable client build, e.g. "0.1.0" or "0.1.0-dev+3f2a1c".
  // Used for logs and diagnostics only; never for protocol decisions.
  string client_version = 2;

  // Ed25519 public key, exactly 32 bytes. Together with the nickname this is
  // everything the server needs before the challenge.
  bytes public_key = 3;

  // Desired display name. Free-form, uniqueness is only enforced among online
  // users. Empty is invalid when the key is unknown to the server.
  string nickname = 4;

  // One-time invite token taken from a rostalk:// invite link. Empty when the
  // client has none: on invite-only servers a returning user whose key the
  // server already knows is admitted without an invite, and open/password
  // modes do not use invites at all.
  string invite = 5;

  // Server password for LOGIN_MODE_PASSWORD servers (design 4.2), empty
  // otherwise. Sent only inside the TLS connection and never logged.
  string password = 6;
}

// Challenge asks the client to prove possession of the private key. Nonces are
// single use and expire together with the pending handshake.
message Challenge {
  // Random nonce, at least 32 bytes. The client signs nonce || server_id.
  bytes nonce = 1;

  // Server identity the client must include in the signed payload: the SHA-256
  // fingerprint of the server's long-lived Ed25519 identity key, in the same
  // encoding as the fp= parameter of invite links.
  bytes server_id = 2;
}

// Authenticate carries the signature produced by the client.
message Authenticate {
  // Ed25519 signature over the byte string nonce || server_id, using the
  // public key from Hello.
  bytes signature = 1;
}

// Welcome is the successful final handshake frame. It replaces any previous
// state: the client must discard its cached snapshot and rebuild from this one.
message Welcome {
  // Complete state snapshot: server, channels, users, roles and own effective
  // permissions (design 4.6). Deltas are delivered afterwards as Events.
  ServerSnapshot snapshot = 1;

  // Id of the caller in the snapshot's users list. The client needs it to find
  // its own row, apply UserUpdated events to it and act on itself; the public
  // key it knows cannot be mapped to an id locally.
  uint64 self_user_id = 2;

  // Bearer token for the chat HTTP endpoints (history, uploads, attachments,
  // stage 4.1). It identifies this authenticated session, not the user: the
  // core keeps it out of the WebView and the token is revoked when the session
  // ends. Never logged.
  string http_token = 3;

  // Remaining lifetime of http_token in seconds. The core renews it by
  // reconnecting; the WebView never sees it.
  uint32 http_token_expires_in_seconds = 4;
}
