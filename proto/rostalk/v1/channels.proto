syntax = "proto3";

// Channel membership, own presence (voice flags, nickname) and media-plane
// credentials (design 4.6, 4.7).
//
// The control plane owns membership: it checks permissions, channel password
// and the user limit, records the user in the channel and only then issues
// short-lived media credentials. The media plane (LiveKit) is never addressed
// by the client directly except with these credentials.
package rostalk.v1;

option go_package = "github.com/v4dikos1/RosTalk/proto/gen/go/rostalk/v1;rostalkv1";

// JoinChannel asks the server to move the caller into a channel.
//
// Reply matrix:
//   - stage 1.3 (membership only, no media backend yet): Ack on success;
//   - stage 1.4+ (media backend wired): MediaCredentials for the voice
//     participant on success.
//
// Any failure is an Error frame. In both cases every other client receives a
// UserMoved event, and the caller's own UserMoved event is sent as well.
message JoinChannel {
  // Target channel id.
  uint64 channel_id = 1;

  // Plain channel password, sent over TLS, only when the channel has one.
  // Empty otherwise. The server verifies it and never stores it in clear text.
  string password = 2;
}

// LeaveChannel removes the caller from the current channel. The reply is an
// Ack; other clients receive a UserMoved event with to_channel_id = 0.
message LeaveChannel {
  // Intentionally empty.
}

// SetNickname changes the caller's own display name. The reply is an Ack, and
// every client (the caller included) receives a UserUpdated event with the new
// name. Requires PERMISSION_CHANGE_NICKNAME.
message SetNickname {
  // New display name: non-empty after trimming. Uniqueness is only enforced
  // among online users, exactly as during the handshake.
  string nickname = 1;
}

// SetVoiceState updates own voice flags. Only the fields that are present are
// changed, so the client can send a single flag instead of the whole state.
message SetVoiceState {
  // New value for the microphone mute flag; unset means "keep current".
  optional bool self_muted = 1;

  // New value for the deafen flag; unset means "keep current".
  optional bool self_deafened = 2;

  // New value for the away flag; unset means "keep current".
  optional bool away = 3;
}

// SetWatching replaces the set of screen shares the caller is watching
// (stage P12). The reply is an Ack; every client that may see the channel
// learns the new list through a UserUpdated event for the caller.
//
// The server is the authority: it keeps an id only when that user is online,
// sits in the caller's voice channel and is publishing a screen share at this
// moment. Other ids are silently dropped instead of failing the request, so a
// click that races the end of a stream does not wipe the rest of the list.
// The list is cleared automatically when the caller leaves the channel, when a
// watched stream stops, and when either session ends.
message SetWatching {
  // Streamer ids the caller watches; an empty list stops watching everything.
  repeated uint64 streamer_ids = 1;
}

// RequestMediaCredentials asks for a media token without changing the channel.
// It is used for the screen-share participant, which is separate from the
// voice participant of the same user (see MediaCredentials.participant_identity).
message RequestMediaCredentials {
  // Channel the credentials are requested for. Must be the caller's current
  // channel for voice, and a channel the caller is present in for streams.
  uint64 channel_id = 1;

  // Which media participant the token is for.
  MediaKind kind = 2;
}

// MediaKind selects the media participant a token belongs to.
enum MediaKind {
  // Not set; clients must treat it as MEDIA_KIND_VOICE.
  MEDIA_KIND_UNSPECIFIED = 0;
  // Voice participant, identity "<user_id>:voice".
  MEDIA_KIND_VOICE = 1;
  // Screen-share participant, identity "<user_id>:stream". Reserved for the
  // stream engine of stage 5.1; the server already issues the token kind.
  MEDIA_KIND_STREAM = 2;
}

// MediaCredentials are everything the client needs to connect to the media
// plane. The client treats the media backend as a black box: address, room and
// token, nothing else (design 3).
message MediaCredentials {
  // WebSocket URL of the media gateway that the client connects to, e.g.
  // "wss://192.168.1.10:7443/rtc". Always on the control plane host, so the
  // certificate pinning and the local proxy rules stay the same.
  string url = 1;

  // Room name inside the media backend.
  string room = 2;

  // Opaque access token for the room, valid for expires_in_seconds.
  // Must never be logged.
  string token = 3;

  // Participant identity to use when connecting:
  // "<user_id>:voice" for MEDIA_KIND_VOICE, "<user_id>:stream" otherwise.
  // Track type is determined by the track source, not by this suffix.
  string participant_identity = 4;

  // Remaining lifetime of the token in seconds (60 in the current design).
  uint32 expires_in_seconds = 5;

  // Which participant the credentials are for.
  MediaKind kind = 6;

  // Channel the credentials were issued for; the token is not valid elsewhere.
  uint64 channel_id = 7;

  // Screen-share presets the caller may use, highest quality last, for example
  // "720p30", "1080p30" and "1080p60". Empty for voice credentials. 1080p60 is
  // only advertised with PERMISSION_STREAM_HQ (design 5.3, stage 5.1).
  repeated string stream_presets = 8;
}
